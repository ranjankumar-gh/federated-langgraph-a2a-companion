# What Claims depends on from Northgate's estimate_repair. Claims owns this file.
seam = "repair_estimate"
owner = "Northgate"
skill = "estimate_repair"
sends = ["claim_id", "damaged_parts"]
refuses = ["photo_url"]  # no Claims human photographs a car
auth = ["mtls", "delegation"]
skew_seconds = 30
revocation_seconds = 120  # the longest a revoked chain may act at Northgate
slo_seconds = 10.0
delivery = "push"  # the assessor desk takes about 21 minutes on frame damage
backstop_seconds = 300  # a lost push is found within five minutes

[breaker]  # Chapter 14: counts only Northgate's failures to answer
late_seconds = 6.0  # Northgate promises 4 s at p95; later than 6 s counts
failures = 3  # counted outcomes inside the window open it
window_seconds = 60
open_seconds = 300  # five minutes before one real estimate tests Northgate
trial = "estimate_repair"  # billed and kept: the plan's cost accepted
max_in_flight = 4  # no more than four sends wait on Northgate at once
mode = "substitute"  # a Claims desk assessor estimates, tagged as the desk's

[reads.estimate]
into = "repair_estimate"
type = "number"
unit = "claim currency"

[reads.notes]  # the shop's own words, passed through by Northgate: text
into = "estimate_notes"
type = "string"
max_chars = 600  # room for any real note; a padded one is refused
