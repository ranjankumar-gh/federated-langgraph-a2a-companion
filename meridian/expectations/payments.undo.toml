# What Claims depends on from Finance's void_payment, the undo of pay_claim.
# Claims owns this file. The compensator sends on it (meridian/saga.py).
seam = "payments.undo"
owner = "Finance"
skill = "void_payment"
sends = ["claim_id", "task"]  # the task is the payment it undoes
auth = ["mtls", "delegation"]
skew_seconds = 30
slo_seconds = 10.0

[retry]
attempts = 3
deadline_seconds = 600

[reads.outcome]
type = "string"
choices = ["voided"]

[reads.owed]
type = "number"
unit = "claim currency"

[reads.residue]
type = "string"
max_chars = 200
