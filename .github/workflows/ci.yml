# Continuous integration for the companion repo. The matrix below lists the Python
# versions the project supports.
#
# It runs the same two commands as the README, the tests and the type check, so a green
# run means the same thing as a green run on your machine. Nothing here needs a secret or
# a network service.

name: ci

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      # --locked fails the job if uv.lock disagrees with pyproject.toml, which is
      # the point of tracking the lockfile. --all-extras installs optional
      # dependency sets (for example a `graph` extra) so no test is skipped for a
      # missing import in CI.
      - name: Install
        run: uv sync --locked --all-extras

      - name: Tests
        run: uv run pytest -q

      - name: Type check
        run: uv run mypy
