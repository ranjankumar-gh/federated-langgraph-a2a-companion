[project]
name = "seamkit"
version = "0.1.0"
description = "Companion code for Federated AI Agents: LangGraph and A2A for Agents You Don't Own"
readme = "README.md"
authors = [{ name = "Ranjan Kumar" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[http-server,signing]==1.2.2",
    "cryptography==50.0.2",
    "langgraph==1.2.15",
    "rfc8785==0.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["seamkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["meridian", "seamkit", "tests"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "types-protobuf>=7.35.1.20260906",
]
