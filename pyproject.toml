[project]
name = "seamkit"
version = "0.1.0"
description = "Companion code for Federated AI Agents: LangGraph and A2A for Agents You Don't Own"
readme = "README.md"
authors = [{ name = "Ranjan Kumar" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["seamkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["seamkit", "tests"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
]
